<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flareviewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/update.js"></script>
    <script type="module" src="src/main.jsx"></script>
    <div style="color: gray;position: absolute; left: 0%; top: 0%; width: 30%; height: 10%;">
      <h1 class="catlyst">Interactive flare viewer</h1>
      <div class="hiden">
        <p>uses DONKI flare database and pulls from SDO for the magnetogram, the orange sphere shows the active region of the current flare</p>
        <br>
        <p>webpage made by Vivian Eagar</p>
      </div>
      <style>
        .hiden {
          display: none;
        } 
    
        .catlyst:hover + .hiden {
          display: block;
        }
      </style>
    </div>
  </body>
</html>
